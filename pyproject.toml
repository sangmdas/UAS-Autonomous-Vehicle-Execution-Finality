[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uas-av-execution-finality-reference"
version = "0.1.0"
description = "Red-team-first reference implementation for act-bound execution finality in UAS and autonomous vehicles"
requires-python = ">=3.11"
authors = [{name = "Sangam Das"}]
license = {text = "See LICENSE and IPR-NOTICE.md"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
